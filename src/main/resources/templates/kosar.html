<!DOCTYPE html>
<html lang="hu" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ride Or Die - Kosár</title>
    <!-- Bootstrap 5 & Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">

    <!-- CSS-ek -->
    <link rel="stylesheet" th:href="@{/main.css}">
    <link rel="stylesheet" th:href="@{/cart.css}">

</head>
<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-xl navbar-dark sticky-top">
    <div class="container">
        <a class="navbar-brand brand-logo fs-3" th:href="@{/}" href="/">RIDE OR <span class="text-red">DIE</span></a>
        <a href="index.html" th:href="@{/}" class="btn btn-outline-light">
            ← Vissza a shopba
        </a>
    </div>
</nav>

<!-- KOSÁR TARTALOM -->
<div class="container my-5">
    <h2 class="brand-font mb-4"><i class="bi bi-cart3 text-red me-2"></i>A Kosarad Tartalma</h2>

    <div class="row g-4">
        <!-- TÁBLÁZAT -->
        <div class="col-lg-8">
            <div class="card p-3">
                <table class="table table-dark align-middle">
                    <thead>
                    <tr class="text-secondary brand-font">
                        <th>Termék</th>
                        <th>Ár</th>
                        <th>Mennyiség</th>
                        <th>Művelet</th>
                    </tr>
                    </thead>
                    <tbody id="cart-items">
                    <!-- JS / Thymeleaf fogja feltölteni dinamikusan -->
                    <tr>
                        <td>Gp Plus V4 Sprint Leather Suit</td>
                        <td class="price-tag">460 900 Ft</td>
                        <td>1 db</td>
                        <td><button class="btn btn-sm btn-outline-danger"><i class="bi bi-trash"></i></button></td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- ÖSSZESÍTŐ ÉS RENDELÉS -->
        <div class="col-lg-4">
            <div class="card p-4">
                <h4 class="brand-font text-red mb-3">Összesítés</h4>
                <div class="d-flex justify-content-between mb-3 fs-5">
                    <span>Végösszeg:</span>
                    <span class="price-tag" id="cart-total">460 900 Ft</span>
                </div>
                <hr class="border-secondary">

                <h5 class="brand-font mb-3">Vásárlói adatok</h5>
                <form th:action="@{/checkout}" method="POST">
                    <div class="mb-3">
                        <input type="text" name="customerName" class="form-control bg-dark text-white border-secondary" placeholder="Teljes neved" required>
                    </div>
                    <div class="mb-3">
                        <input type="email" name="customerEmail" class="form-control bg-dark text-white border-secondary" placeholder="E-mail címed" required>
                    </div>
                    <button type="submit" class="btn btn-red w-100 mt-2">RENDELÉS LEADÁSA <i class="bi bi-check-circle ms-1"></i></button>
                </form>
            </div>
        </div>
    </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.bundle.min.js"></script>

<script th:src="@{/app.js}" src="../static/app.js"></script>
</body>
</html>
